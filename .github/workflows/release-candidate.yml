name: Release candidate matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: ${{ matrix.target }}
    env:
      JIXU_RELEASE_CHANNEL: npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.13.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate source and host package path
        run: pnpm run check:release
      - name: Build verified host artifact
        run: pnpm run pack:packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: .artifacts/packages/native/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate authoritative package set
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.13.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: .artifacts/native
      - name: Pack all target artifacts
        run: >-
          node scripts/package-artifacts.ts
          --out .artifacts/release
          --native-root .artifacts/native
      - name: Verify aggregated Linux consumer path
        run: >-
          node scripts/verify-package-portability.ts
          --native-root .artifacts/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jixu-release-candidates
          path: .artifacts/release
          if-no-files-found: error
          retention-days: 7
